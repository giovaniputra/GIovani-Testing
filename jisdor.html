<title>JISDOR Tracker</title>
<style>
  :root{--ink:#141414;--mute:#717171;--line:#e6e6e6;--accent:#ce1126;--bg:#fafafa}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:16px;display:flex;justify-content:center}
  main{width:min(100%,900px)}
  h1{margin:0 0 4px}
  .sub{color:var(--mute);margin:0 0 16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
  .card b{display:block;font-size:28px}
  .card span{color:var(--mute);font-size:13px}
  .tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;position:relative}
  canvas{width:100%;height:320px;display:block}
  #tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:4px 8px;border-radius:4px;font-size:13px;display:none;white-space:nowrap}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);margin-top:16px}
  th{background:var(--ink);color:#fff;text-align:left}
  th,td{padding:8px 12px;font-size:14px}
  tr+tr td{border-top:1px solid var(--line)}
  .up{color:var(--accent)}.down{color:#1a7f37}
  .note{color:var(--mute);font-size:12px;margin-top:12px}
</style>
